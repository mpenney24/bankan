name: CI / Test Pipeline

on:
    push:
        branches: [main, master]
    pull_request:
        branches: [main, master]

jobs:
    typecheck:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Set up Node.js (and Cache Dependencies)
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: 'pnpm'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: TypeCheck TypeScript
              run: pnpm tsc --noEmit

    docker-test:
        needs: typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Set up Docker
              uses: docker/setup-buildx-action@v4

            - name: Build Docker image
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile
                  load: true
                  tags: bankan-backend:latest
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Run containerised test suite
              run: |
                  docker run --rm \
                    -e VITE_FIREBASE_COLUMN_ID="${{ secrets.VITE_FIREBASE_COLUMN_ID }}" \
                    -e VITE_FIREBASE_API_KEY="${{ secrets.VITE_FIREBASE_API_KEY }}" \
                    bankan-backend:latest pnpm test

    e2e-tests:
        needs: docker-test
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: latest

            - name: Set up Node.js (and Cache Dependencies)
              uses: actions/setup-node@v7
              with:
                  node-version: 22.13.0
                  cache: 'pnpm'

            - name: Set up Java 21 (Required for Firebase Emulators)
              uses: actions/setup-java@v5
              with:
                  distribution: 'temurin'
                  java-version: '21'

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Playwright browsers (Chrome only)
              run: pnpm --filter @bankan/app exec playwright install --with-deps chromium

            - name: Run Playwright E2E Tests
              run: pnpm --filter @bankan/app test:e2e
              env:
                  CI: true
                  VITE_FIREBASE_COLUMN_ID: '${{ secrets.VITE_FIREBASE_COLUMN_ID }}'
                  VITE_FIREBASE_API_KEY: '${{ secrets.VITE_FIREBASE_API_KEY }}'

            - name: Upload Playwright Report on Failure
              uses: actions/upload-artifact@v7
              if: failure()
              with:
                  name: playwright-report
                  path: app/web/playwright-report/
                  retention-days: 7
